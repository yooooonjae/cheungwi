# 「층위(層位)」 CI — 저장소를 checkout 한 것만으로 도는 검사 전부.
#
# 수집기는 부르지 않는다(API 키가 없고, 쿼터를 태울 이유도 없다). 대신 분석 산출
# (out/*.json)·원장(data/DATA_MANIFEST.json)·OG 카드가 저장소에 커밋돼 있어, 전
# 스위트가 **실물**을 읽고 검증한다.
#
# 배포는 여기서 하지 않는다. 검증을 통과한 로컬 파이프라인만 pages.dev 로 올린다 —
# 초록 체크가 곧 배포가 되면 "검증된 것만 나간다"는 순서가 뒤집힌다.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# 산출물 필수 — 부재는 skip 이 아니라 실패다. 산출물이 없는 러너에서 순수 함수
# 검사만 통과한 초록은 "검사했다"가 아니라 "검사하지 않았다"는 뜻이라서,
# 가드가 켜진 세션은 한 건도 돌기 전에 부재 목록을 들고 멈춘다(conftest.py).
env:
  CHEUNGWI_REQUIRE_ARTIFACTS: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # node 는 선택이 아니다 — 패리티(파이썬 엔진 ↔ 자바스크립트 미러)와 조형
      # 러너가 실제로 node 프로세스를 왕복시키고, node 가 없으면 그 검사들은
      # 건너뛰는 대신 실패한다.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 빌드가 부르는 terser 를 미리 한 번 받아 둔다. 첫 호출이 다운로드까지
      # 떠안으면 빌드 안의 호출 제한시간에 걸릴 수 있다.
      - name: Warm terser cache
        run: npx --yes terser --version

      # 전 소스 바이트컴파일 — find 로 하위 패키지까지 전부 건다(셸 globstar 에
      # 기대지 않는다). 문법 회귀는 여기서 걸린다.
      - name: Byte-compile Python sources
        run: find src -name '*.py' -print0 | xargs -0 python -m py_compile

      # 사이트 스크립트 문법 — 반드시 파일마다 돈다.
      # `node --check a.js b.js` 는 첫 파일만 보고 끝난다.
      - name: Check site scripts (file by file)
        run: |
          for f in site/js/*.js; do
            echo "node --check $f"
            node --check "$f" || exit 1
          done

      # 전체 스위트. 엔진·수집기 단위 검사부터 out/ 실물 계약, 패리티(200조 이상),
      # 조형 좌표, 빌드 게이트까지 한 번에 돈다.
      - name: Full test suite
        run: python -m pytest tests/ -q

      # 빌드 게이트를 실물로 한 번 더 통과시킨다 — 미치환 플레이스홀더·한국어
      # 조사 분리·선언과 실재의 불일치는 여기서 멈춘다. 산출(web/)은 버린다.
      - name: Build gate (site/ -> web/)
        run: python src/build/assemble.py
