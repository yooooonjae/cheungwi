# 「층위(層位)」 CI — 저장소를 checkout 한 것만으로 도는 검사 전부.
#
# 수집기는 부르지 않는다(API 키가 없고, 쿼터를 태울 이유도 없다). 대신 분석 산출
# (out/*.json)·원장(data/DATA_MANIFEST.json)·OG 카드가 저장소에 커밋돼 있어, 전
# 스위트가 **실물**을 읽고 검증한다.
#
# 검사 목록은 여기 적지 않는다 — `make check` 를 그대로 부른다. 스텝을 따로 나열하면
# 로컬과 CI 가 조용히 갈라지고, 그때부터 로컬 초록은 아무것도 보장하지 못한다.
# 무엇이 도는지는 Makefile 의 check 타깃 한 곳에 있다.
#
# 배포는 여기서 하지 않는다. 로컬 파이프라인(refresh)이 빌드 뒤 같은 스위트를 한 번 더
# 돌려 통과했을 때만 pages.dev 로 올린다 — 초록 체크가 곧 배포가 되면 "검증된 것만
# 나간다"는 순서가 뒤집힌다.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# 산출물 필수 — 부재는 skip 이 아니라 실패다. 산출물이 없는 러너에서 순수 함수
# 검사만 통과한 초록은 "검사했다"가 아니라 "검사하지 않았다"는 뜻이라서,
# 가드가 켜진 세션은 한 건도 돌기 전에 부재 목록을 들고 멈춘다(conftest.py).
env:
  CHEUNGWI_REQUIRE_ARTIFACTS: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # node 는 선택이 아니다 — 패리티(파이썬 엔진 ↔ 자바스크립트 미러)와 조형
      # 러너가 실제로 node 프로세스를 왕복시키고, node 가 없으면 그 검사들은
      # 건너뛰는 대신 실패한다.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 빌드가 부르는 terser 를 미리 한 번 받아 둔다. 첫 호출이 다운로드까지
      # 떠안으면 빌드 안의 호출 제한시간에 걸릴 수 있다.
      - name: Warm terser cache
        run: npx --yes terser --version

      # 로컬 `make check` 와 **같은 명령**이다. 전 소스 바이트컴파일 → 사이트
      # 스크립트 문법(파일마다) → 전체 스위트 → 빌드 게이트 순으로 돈다.
      # 러너에 venv 가 없으므로 Makefile 의 PY 는 setup-python 의 python3 를 고른다.
      - name: make check
        run: make check
