<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>층위(層位) OG 카드</title>
<style>
  /* 「층위(層位)」 OG 카드 1200×630 — 야간 단면.
     서장의 도면을 그대로 줄인 미니어처다: 20층 × 6칸의 창(꺼진 8칸 = 공실 6.8%),
     오른쪽에 자본 스택(선순위·메자닌·지분), 그 둘을 가로지르는 부채의 수면.
     색은 tokens.css 의 야간 값과 hero.css 의 창 두 색을 그대로 옮겨 적었다.

     재생성: make og  (Chrome 헤드리스 --window-size=1200,630 --screenshot)
     외부 자원을 하나도 부르지 않는다 — file:// 로 찍히므로 네트워크 자원은 빈칸이 된다. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  :root {
    --paper: #14120f; --surface: #1c1915; --surface-2: #26221c;
    --ink: #e8e2d6; --ink-2: #b8b0a1; --ink-3: #8a8272;
    --hairline: #322c24; --hairline-2: #4a4235;
    --stratum-2: #4a4133; --stratum-3: #6b5c44;
    --senior: #4a6b80; --mezz: #8aa6c0; --equity: #e0a463;
    --waterline: #4f9bb8; --waterline-wash: #1a2a33;
    --win-lit: #e3b268; --win-off: #0d0b08;
    --font-title: "Noto Serif KR", "AppleMyungjo", "Nanum Myeongjo", Georgia, serif;
    --font-body: "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", -apple-system, sans-serif;
    --font-num: "SF Mono", "Menlo", "Consolas", monospace;
  }
  body {
    position: relative; overflow: hidden;
    font-family: var(--font-body); color: var(--ink);
    background:
      radial-gradient(58% 74% at 78% 26%, rgba(224, 164, 99, .10), transparent 64%),
      radial-gradient(54% 70% at 14% 84%, rgba(79, 155, 184, .10), transparent 62%),
      linear-gradient(158deg, #100e0b 0%, #14120f 48%, #1a1713 100%);
  }
  /* 발굴 현장의 모눈 */
  body::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background-image:
      linear-gradient(rgba(141, 123, 96, .055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(141, 123, 96, .055) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .frame { position: absolute; inset: 26px; border: 1px solid rgba(184, 176, 161, .13); border-radius: 16px; }
  .wrap { position: absolute; inset: 0; display: flex; align-items: center; gap: 24px; padding: 62px 64px; }

  .left { width: 590px; }
  .kicker { color: var(--equity); font-size: 18px; font-weight: 800; letter-spacing: .3em; }
  .titline { display: flex; align-items: baseline; gap: 20px; margin-top: 22px; }
  .hanja { font-family: var(--font-title); font-size: 122px; line-height: .88; color: var(--equity);
           text-shadow: 0 2px 34px rgba(224, 164, 99, .22); }
  .ko { font-size: 58px; font-weight: 800; letter-spacing: .05em; }
  .line { margin-top: 26px; font-size: 28px; font-weight: 700; color: var(--ink); letter-spacing: -.01em; }
  .sub { margin-top: 14px; font-size: 19px; line-height: 1.5; color: var(--ink-2); }
  .lineage { margin-top: 28px; display: flex; align-items: center; gap: 10px; font-size: 19px; color: var(--ink-3); }
  .lineage b { color: var(--equity); font-weight: 800; }
  .lineage i { font-style: normal; color: var(--hairline-2); }

  .right { width: 458px; }
  .right svg { display: block; width: 458px; }

  .url { position: absolute; left: 64px; bottom: 44px; font-family: var(--font-num);
         font-size: 18px; letter-spacing: .09em; color: var(--equity); font-weight: 600; }
  .foot { position: absolute; right: 64px; bottom: 44px; font-size: 15px; color: var(--ink-3); letter-spacing: .03em; }

  /* 단면 */
  .tower-body { fill: var(--surface-2); }
  .tower-cap { fill: var(--stratum-3); }
  .tower-wall { fill: var(--stratum-2); }
  .lit { fill: var(--win-lit); }
  .off { fill: var(--win-off); }
  .fl { stroke: rgba(20, 18, 15, .55); stroke-width: 1; }
  .senior { fill: var(--senior); }
  .mezz { fill: var(--mezz); }
  .equity { fill: var(--equity); }
  .water-wash { fill: var(--waterline); opacity: .28; }
  .water { stroke: var(--waterline); stroke-width: 2.5; }
  .water-dash { stroke: var(--waterline); stroke-width: 1.5; stroke-dasharray: 3 5; opacity: .8; }
  .ground { stroke: var(--hairline-2); stroke-width: 1.5; }
  .hatch { stroke: var(--hairline); stroke-width: 1; }
  .lab { font-family: var(--font-body); font-size: 13px; fill: var(--ink-3); }
  .lab-head { font-weight: 700; fill: var(--ink-2); }
  .lab-water { fill: var(--waterline); font-weight: 700; }
</style>
</head>
